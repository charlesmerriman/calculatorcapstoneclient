<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Umagon face icon set. favicon.ico carries 16/24/32/48/64 for browsers that
      still request /favicon.ico by default; the PNG links cover everything
      modern, and the 192/512 pair is what Android reaches for when a page is
      added to a home screen. All are transparent, so they sit correctly on
      light and dark tab bars alike.
    -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512x512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uma Musume Carat Calculator</title>
    <meta name="description" content="Plan your Uma Musume gacha pulls and predict carat and ticket availability based on your rank income and upcoming events." />

    <!--
      Site-wide social defaults. These are the ONLY tags link unfurlers ever see:
      Discord, Reddit, Slack and Twitter fetch this raw HTML and never run the JS
      that sets per-route titles, so a shared link to any page previews with the
      text below. useDocumentMeta handles tabs and search engines; this handles
      the preview card. Per-route previews would need prerendering.

      og:image is the umagon face on an opaque dark ground, NOT one of the
      favicon PNGs directly. Those are 45% transparent, and unfurlers flatten
      alpha themselves — X onto black, which swallows the face's black
      outlines. Compositing it here makes the card identical everywhere
      instead of depending on each service's choice.

      It is square (512x512) and paired with twitter:card=summary, which is
      the small square-thumbnail card. A big landscape card would mean
      summary_large_image AND a 2:1 image — a layout to design, not a crop of
      this one.

      NOTE: absolute URL required — unfurlers do not resolve relative paths.
      This does not survive a domain move; update it together with
      public/sitemap.xml and public/robots.txt.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Uma Musume Carat Calculator" />
    <meta property="og:title" content="Uma Musume Carat Calculator" />
    <meta property="og:description" content="Plan your Uma Musume gacha pulls and predict carat and ticket availability based on your rank income and upcoming events." />
    <meta property="og:url" content="https://umacaratcalculator.com/" />
    <meta property="og:image" content="https://umacaratcalculator.com/social-card.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="The Uma Musume Carat Calculator umagon mascot." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Uma Musume Carat Calculator" />
    <meta name="twitter:description" content="Plan your Uma Musume gacha pulls and predict carat and ticket availability based on your rank income and upcoming events." />
    <meta name="twitter:image" content="https://umacaratcalculator.com/social-card.png" />
    <meta name="twitter:image:alt" content="The Uma Musume Carat Calculator umagon mascot." />

    <!--
      Google AdSense. This tag is BOTH the site-ownership verification Google
      asks for during the application and the runtime that serves ads once the
      account is approved - there is no separate verification tag to remove
      later, so it stays exactly as-is.

      The ca-pub- publisher ID is public by design: it is visible in this HTML
      on every page, and it is the same ID declared in public/ads.txt. It is an
      account identifier, not a credential, so it belongs in the repo.

      Placed last in <head> and loaded async so it never blocks the app bundle.
      Until the account is approved this fetches the script and serves nothing.

      NOTE: whether ads actually appear - and WHERE - is controlled entirely in
      the AdSense dashboard (Auto ads formats, ad load, page exclusions), not
      here. Side rails in particular can squeeze the planner below
      --container-banner-table's minimum width, where the banner table stops
      rendering as a spreadsheet; keep that format off.
    -->
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9720922917211031"
      crossorigin="anonymous"
    ></script>
  </head>
  <body class="bg-neutral-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
